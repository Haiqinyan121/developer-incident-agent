[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-incident-agent"
version = "0.1.0"
description = "A lightweight developer incident diagnosis agent using LangChain tools and RAG"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12,<1",
    "httpx>=0.27,<1",
    "PyMuPDF>=1.24,<2",
    "chromadb>=0.5,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langchain-chroma>=0.1,<2",
    "langchain-text-splitters>=0.3,<2",
    "openai>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
